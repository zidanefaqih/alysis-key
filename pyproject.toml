[project]
name = "alysis-key"
version = "2.0.0"
description = "Store and print Alysis Code gateway keys (slk_...) via device flow — one numbered file per login, never overwritten"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "zidanefaqih" }]
keywords = ["alysis", "alysis-code", "device-flow", "cli", "api-key"]

[project.scripts]
alysis-key = "alysis_key:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["alysis_key.py"]

[tool.uv]
package = true
